<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Organograma – Servidores do Tocantins</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #222; }

    header {
      background: #1a3a5c; color: #fff;
      padding: 18px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    .toolbar {
      background: #fff; border-bottom: 1px solid #dde3ea;
      padding: 12px 32px; display: flex; align-items: center; gap: 12px;
    }
    #searchBox {
      flex: 1; max-width: 380px; padding: 8px 14px;
      border: 1px solid #ccd3db; border-radius: 6px; font-size: 0.88rem;
    }
    .btn {
      padding: 8px 14px; border: 1px solid #ccd3db; border-radius: 6px;
      background: #fff; font-size: 0.82rem; cursor: pointer;
      color: #1a3a5c; font-weight: 500;
    }
    .btn:hover { background: #eef2f7; }

    #treeContainer { padding: 24px 32px 48px; }
    ul.tree { list-style: none; padding: 0; }
    ul.tree ul { padding-left: 28px; border-left: 1.5px solid #dde3ea; margin-left: 10px; }

    .node-header {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 7px;
      cursor: pointer; user-select: none; transition: background .12s;
    }
    .node-header:hover { background: #e8edf4; }

    .toggle-icon {
      width: 18px; height: 18px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; background: #dde3ea;
      font-size: 11px; color: #1a3a5c; font-weight: 700;
      transition: transform .18s;
    }
    .toggle-icon.open { transform: rotate(90deg); }

    .setor-label { font-weight: 600; font-size: 0.88rem; color: #1a3a5c; }
    .badge {
      font-size: 0.72rem; background: #dde3ea; color: #445;
      border-radius: 20px; padding: 1px 8px; font-weight: 500; margin-left: 4px;
    }
    .badge.chefia { background: #fff3cd; color: #7a5700; }

    .children { display: none; }
    .children.open { display: block; }

    .srv-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #c8d8ec; color: #1a3a5c;
      font-size: 0.7rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .srv-avatar.chefia { background: #ffe082; color: #7a5700; }
    .srv-name { font-size: 0.83rem; font-weight: 600; color: #223; }
    .srv-cargo { font-size: 0.75rem; color: #667; }
    .srv-info { display: flex; flex-direction: column; }

    .loading { font-size: 0.8rem; color: #999; padding: 6px 10px; }
  </style>
</head>
<body>

<header>
  <h1>Organograma dos Servidores do Estado do Tocantins</h1>
  <p>Visualização hierárquica por setor</p>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Buscar setor…">
  <button class="btn" onclick="expandAll()">Expandir tudo</button>
  <button class="btn" onclick="collapseAll()">Recolher tudo</button>
</div>

<div id="treeContainer">
  <ul class="tree" id="treeRoot">

    <!-- Thymeleaf renderiza os setores raiz -->
    <th:block th:each="setor : ${setores}">
      <li class="node" th:replace="~{setor :: setor(${setor})}"></li>
    </th:block>

  </ul>
</div>

<script>
  // ── Expandir / Recolher ──────────────────────────────────
  function expandAll() {
    document.querySelectorAll('.children').forEach(c => c.classList.add('open'));
    document.querySelectorAll('.toggle-icon').forEach(i => i.classList.add('open'));
  }
  function collapseAll() {
    document.querySelectorAll('.children').forEach(c => c.classList.remove('open'));
    document.querySelectorAll('.toggle-icon').forEach(i => i.classList.remove('open'));
  }

  // ── Toggle setor com AJAX ────────────────────────────────
  function toggleSetor(el, setor) {
    const li       = el.closest('li');
    const children = li.querySelector('.children');
    const icon     = el.querySelector('.toggle-icon');

    children.classList.toggle('open');
    icon.classList.toggle('open');

    // Só busca se ainda não carregou os servidores
    const srvContainer = li.querySelector('.servidores-container');
    if (srvContainer && !srvContainer.dataset.loaded) {
      srvContainer.dataset.loaded = 'true';
      srvContainer.innerHTML = '<li class="loading">Carregando...</li>';

      fetch(`/api/organograma/servidores?setor=${encodeURIComponent(setor)}`)
        .then(r => r.json())
        .then(servidores => {
          srvContainer.innerHTML = '';
          if (servidores.length === 0) {
            srvContainer.innerHTML = '<li class="loading">Nenhum servidor lotado.</li>';
            return;
          }
          servidores.forEach(srv => {
            srvContainer.appendChild(criarNoServidor(srv));
          });
        })
        .catch(() => {
          srvContainer.innerHTML = '<li class="loading">Erro ao carregar.</li>';
        });
    }
  }

  // ── Cria nó de servidor dinamicamente ───────────────────
  function criarNoServidor(srv) {
    const li = document.createElement('li');
    li.className = 'node';

    const header = document.createElement('div');
    header.className = 'node-header';
    header.style.cursor = 'default';

    const avatar = document.createElement('div');
    avatar.className = srv.tipoCargo === 'CHEFIA' ? 'srv-avatar chefia' : 'srv-avatar';
    const iniciais = srv.nome.split(' ')
      .filter(p => p.length > 2).slice(0, 2).map(p => p[0]).join('');
    avatar.textContent = iniciais || '?';

    const info = document.createElement('div');
    info.className = 'srv-info';
    info.innerHTML = `
      <span class="srv-name">${srv.nome} 
		<span class="srv-cargo">${srv.numfunc}</span>
	  </span>
	  
      ${srv.nomeCargo ? `<span class="srv-cargo">${srv.nomeCargo}</span> ` : ''}
    `;

    header.appendChild(avatar);
    header.appendChild(info);

    if (srv.tipoCargo === 'CHEFIA') {
      const badge = document.createElement('span');
      badge.className = 'badge chefia';
      badge.textContent = 'Chefia';
      header.appendChild(badge);
    }

    li.appendChild(header);
    return li;
  }

  // ── Busca ────────────────────────────────────────────────
  document.getElementById('searchBox').addEventListener('input', function() {
    const termo = this.value.toLowerCase().trim();
    document.querySelectorAll('.node').forEach(node => {
      const label = node.querySelector('.setor-label');
      if (!label) return;
      node.style.display = (!termo || label.textContent.toLowerCase().includes(termo))
        ? '' : 'none';
    });
  });
</script>
</body>
</html>
