<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Organograma – Servidores do Tocantins</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

	<header>
		<h1>Organograma dos Servidores do Estado do Tocantins</h1>

		<!-- Botão dark/light mode -->
		<button id="themeToggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
			<img id="themeIcon" src="icons/moon.png" alt="Tema escuro">
		</button>
	</header>

	<div class="toolbar">
		<input type="text" id="searchBox" placeholder="Buscar setor, servidor ou numfunc…" autocomplete="off">
		<button class="btn" id="btnExpandAll">Expandir tudo</button>
		<button class="btn" id="btnCollapseAll">Recolher tudo</button>

		<!-- Painel de resultados de servidores -->
		<div id="searchResults"></div>
	</div>

	

	<div class="main-layout">



		<div id="treeContainer">
			<ul class="tree" id="treeRoot">
				<th:block th:each="setor : ${setores}">
					<li class="node" th:replace="~{organograma/setor :: setor(${setor})}"></li>
				</th:block>
			</ul>
			
		</div>
		<div id="treemapConteiner"></div>
		<div id="treeServ"></div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
	<script type="module" th:src="@{/js/main.js}"></script>
	<script th:src="@{/js/treemap.js}"></script>
	
</body>

</html>
